import json, hashlib, time, pathlib
from dataclasses import dataclass, field
from typing import List, Optional

@dataclass
class MemoryRecord:
    id: str
    content_preview: str    # first 80 chars only
    file_path: str
    timestamp: float
    access_count: int
    domain: str
    embedding_stub: List[float] = field(default_factory=list)

class TokenAwareIndex:
    INDEX_PATH = pathlib.Path("memory_fabric/indices/master_index.json")
    OVERFLOW_PATH = pathlib.Path("memory_fabric/indices/overflow_queue.json")
    TOKENS_PER_CHAR = 0.25  # conservative estimate

    def __init__(self, context_limit: int = 512, reserve: int = 150):
        self.context_limit = context_limit
        self.reserve = reserve
        self.budget = context_limit - reserve
        self.records: List[MemoryRecord] = self._load_index()

    def _load_index(self) -> List[MemoryRecord]:
        if not self.INDEX_PATH.exists():
            return []
        raw = json.loads(self.INDEX_PATH.read_text())
        return [MemoryRecord(**r) for r in raw]

    def _estimate_tokens(self, text: str) -> int:
        return max(1, int(len(text) * self.TOKENS_PER_CHAR))

    def _score(self, rec: MemoryRecord, prompt: str) -> float:
        # keyword overlap score
        prompt_words = set(prompt.lower().split())
        preview_words = set(rec.content_preview.lower().split())
        overlap = len(prompt_words & preview_words) / max(1, len(prompt_words))
        # recency decay
        age_hours = (time.time() - rec.timestamp) / 3600
        recency = 1.0 / (1.0 + age_hours * 0.01)
        # frequency bonus
        freq = min(1.0, rec.access_count * 0.1)
        return (overlap * 0.6) + (recency * 0.25) + (freq * 0.15)

    def get_relevant_memories(self, current_prompt: str) -> List[MemoryRecord]:
        scored = sorted(
            [(rec, self._score(rec, current_prompt)) for rec in self.records],
            key=lambda x: x[1], reverse=True
        )
        selected, overflow, token_count = [], [], 0
        for rec, score in scored:
            cost = self._estimate_tokens(rec.content_preview)
            if token_count + cost <= self.budget:
                selected.append(rec)
                rec.access_count += 1
                token_count += cost
            else:
                overflow.append(rec.id)
        self.OVERFLOW_PATH.write_text(json.dumps(overflow, indent=2))
        self._save_index()
        return selected

    def add_memory(self, content: str, domain: str, file_path: str) -> str:
        rid = hashlib.sha1(f"{content}{time.time()}".encode()).hexdigest()[:12]
        rec = MemoryRecord(
            id=rid,
            content_preview=content[:80],
            file_path=file_path,
            timestamp=time.time(),
            access_count=0,
            domain=domain
        )
        self.records.append(rec)
        self._save_index()
        return rid

    def _save_index(self):
        self.INDEX_PATH.parent.mkdir(parents=True, exist_ok=True)
        data = [vars(r) for r in self.records]
        self.INDEX_PATH.write_text(json.dumps(data, indent=2))`

import uuid, json, re, pathlib
from typing import List, Optional
from dataclasses import dataclass, field

COMMENT_PREFIX = {
    "python": "#", "cpp": "//", "csharp": "//",
    "js": "//", "ts": "//", "rust": "//", "go": "//"
}

@dataclass
class AtomicUnit:
    uuid: str
    integration_group: str
    expansion_ports: List[str]
    cross_refs: List[str]
    lang: str
    layer: str
    code: str
    file_path: str = ""

class AtomicReferenceSystem:
    REGISTRY_PATH = pathlib.Path("memory_fabric/indices/atomic_registry.json")

    def __init__(self):
        self.registry: dict[str, AtomicUnit] = self._load()
        self.groups: dict[str, List[str]] = {}  # group_id -> [uuids]
        for uid, unit in self.registry.items():
            self.groups.setdefault(unit.integration_group, []).append(uid)

    def _load(self) -> dict:
        if not self.REGISTRY_PATH.exists():
            return {}
        raw = json.loads(self.REGISTRY_PATH.read_text())
        return {k: AtomicUnit(**v) for k, v in raw.items()}

    def _save(self):
        self.REGISTRY_PATH.parent.mkdir(parents=True, exist_ok=True)
        self.REGISTRY_PATH.write_text(
            json.dumps({k: vars(v) for k, v in self.registry.items()}, indent=2)
        )

    def stamp(
        self,
        code: str,
        integration_group: str,
        expansion_ports: List[str],
        cross_refs: List[str],
        lang: str = "python",
        layer: str = "logic"
    ) -> AtomicUnit:
        uid = uuid.uuid4().hex[:12]
        prefix = COMMENT_PREFIX.get(lang, "#")
        header = (
            f"{prefix} ATOMIC_REF::uuid={uid}\\n"
            f"{prefix} INTEGRATION_GROUP::{integration_group}\\n"
            f"{prefix} EXPANSION_PORTS::{','.join(expansion_ports) or 'none'}\\n"
            f"{prefix} CROSS_REFS::{','.join(cross_refs) or 'none'}\\n"
            f"{prefix} LAYER::{layer}\\n"
        )
        unit = AtomicUnit(
            uuid=uid,
            integration_group=integration_group,
            expansion_ports=expansion_ports,
            cross_refs=cross_refs,
            lang=lang,
            layer=layer,
            code=header + code
        )
        self.registry[uid] = unit
        self.groups.setdefault(integration_group, []).append(uid)
        self._save()
        return unit

    def pull_group_to_context(self, integration_group: str) -> str:
        """Returns all atomic units in a group concatenated — for agent injection."""
        uids = self.groups.get(integration_group, [])
        return "\\n\\n".join(
            self.registry[uid].code for uid in uids if uid in self.registry
        )

    def batch_replace(self, integration_group: str, find: str, replace: str) -> int:
        uids = self.groups.get(integration_group, [])
        count = 0
        for uid in uids:
            if uid in self.registry:
                unit = self.registry[uid]
                if find in unit.code:
                    unit.code = unit.code.replace(find, replace)
                    count += 1
        self._save()
        return count`

from memory_index_manager import TokenAwareIndex
from atomic_reference_system import AtomicReferenceSystem

TOKENS_PER_CHAR = 0.25
MAX_TOKENS = 512
SYSTEM_OVERHEAD = 80  # reserved for system prompt framing

class ContextAssembler:
    def __init__(self, domain: str):
        self.domain = domain
        self.index = TokenAwareIndex(context_limit=MAX_TOKENS)
        self.ars = AtomicReferenceSystem()

    def _tok(self, text: str) -> int:
        return max(1, int(len(text) * TOKENS_PER_CHAR))

    def build(self, user_prompt: str, active_groups: list[str] = None) -> str:
        budget = MAX_TOKENS - SYSTEM_OVERHEAD - self._tok(user_prompt)
        parts = []

        # Pull relevant memories
        memories = self.index.get_relevant_memories(user_prompt)
        for mem in memories:
            preview = f"[MEM:{mem.id}] {mem.content_preview}"
            cost = self._tok(preview)
            if budget - cost >= 0:
                parts.append(preview)
                budget -= cost

        # Pull requested integration groups
        if active_groups:
            for group in active_groups:
                group_code = self.ars.pull_group_to_context(group)
                cost = self._tok(group_code)
                if budget - cost >= 0:
                    parts.append(f"[GROUP:{group}]\\n{group_code}")
                    budget -= cost

        context = "\\n".join(parts)
        return f"<memory>\\n{context}\\n</memory>\\n\\nUser: {user_prompt}"`
      }
    ]

import subprocess, json, pathlib, time

class ScriptExecutor:
    def run(self, script_path: str, timeout: int = 120) -> dict:
        start = time.time()
        try:
            result = subprocess.run(
                ["python", script_path],
                capture_output=True, text=True, timeout=timeout
            )
            return {
                "success": result.returncode == 0,
                "stdout": result.stdout[-2000:],  # last 2000 chars only
                "stderr": result.stderr[-500:],
                "duration_s": round(time.time() - start, 2)

        except subprocess.TimeoutExpired:
            return {"success": False, "stdout": "", "stderr": "Timeout", "duration_s": timeout}

class ResultCompressor:
    TOKENS_PER_CHAR = 0.25

    def compress(self, project_path: str, exec_result: dict, max_tokens: int = 80) -> str:

            file_count = len(manifest)
            total_chars = sum(v.get("size", 0) for v in manifest.values())
        else:
            file_count = 0
            total_chars = 0

        expansion_points = self._scan_expansion_ports(project_path)

        lines = [
            f"BUILD RESULT: {'OK' if exec_result['success'] else 'FAILED'}",
            f"Files: {file_count} | Total: {total_chars} chars",
            f"Next expansion points: {', '.join(expansion_points[:5])}",
        ]
        if not exec_result["success"]:
            lines.append(f"Error: {exec_result['stderr'][:100]}")

        return "\\n".join(lines)

import json, time, pathlib, shutil

class DriveRouter:
    def __init__(self, hot_base: str, warm_base: str, cold_base: str):
        self.tiers = {
            "hot":  (pathlib.Path(hot_base),  7   * 86400),   # 7 days
            "warm": (pathlib.Path(warm_base), 30  * 86400),   # 30 days
            "cold": (pathlib.Path(cold_base), float("inf")),  # forever
        }

    def resolve(self, file_path: str) -> pathlib.Path:
        """Find which drive actually has this file."""
        rel = pathlib.Path(file_path).name
        for tier, (base, _) in self.tiers.items():
            candidate = base / rel
            if candidate.exists():
                return candidate
        return pathlib.Path(file_path)  # fallback to original path

    def promote_or_demote(self, file_path: str, last_access_ts: float):
        """Move file to correct tier based on last access time."""
        age = time.time() - last_access_ts
        src = self.resolve(file_path)
        if not src.exists():
            return

        if age < self.tiers["hot"][1]:
            target_base = self.tiers["hot"][0]
        elif age < self.tiers["warm"][1]:
            target_base = self.tiers["warm"][0]
        else:
            target_base = self.tiers["cold"][0]

        dest = target_base / src.name
        if src != dest:
            dest.parent.mkdir(parents=True, exist_ok=True)
            shutil.move(str(src), str(dest))`

let completedTasks = new Set();
let totalTasks = phases.reduce((a, p) => a + p.tasks.length, 0);

function updateProgress() {
  const pct = Math.round((completedTasks.size / totalTasks) * 100);
  document.getElementById('global-bar').style.width = pct + '%';
  document.getElementById('global-label').textContent = `${completedTasks.size} of ${totalTasks} tasks complete`;
}

function renderPhaseNav() {
  const nav = document.getElementById('phase-nav');
  phases.forEach((ph, i) => {
    const btn = document.createElement('button');
    btn.className = 'phase-btn' + (i === 0 ? ' active' : '');
    btn.textContent = ph.label;
    btn.onclick = () => {
      document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.phase-content').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('phase-' + i).classList.add('active');
    };
    nav.appendChild(btn);
  });
}

function diffTag(d) {
  if (d === 'easy') return '<span class="tag tag-easy">easy</span>';
  if (d === 'medium') return '<span class="tag tag-medium">medium</span>';
  return '<span class="tag tag-hard">hardest</span>';
}
function langTags(tags) {
  return tags.map(t => {
    const cls = t === 'py' ? 'tag-py' : t === 'json' ? 'tag-json' : t === 'sh' ? 'tag-sh' : 'tag-medium';
    return `<span class="tag ${cls}">${t}</span>`;
  }).join('');
}

function renderPhases() {
  const panels = document.getElementById('phase-panels');
  phases.forEach((ph, pi) => {
    const div = document.createElement('div');
    div.className = 'phase-content' + (pi === 0 ? ' active' : '');
    div.id = 'phase-' + pi;

    let taskHtml = ph.tasks.map((t, ti) => {
      const taskId = `task-${pi}-${ti}`;
      return `
      <div class="task" id="${taskId}-wrap">
        <div class="task-header" onclick="toggleDetail('${taskId}')">
          <div class="task-check" id="${taskId}-check" onclick="event.stopPropagation(); toggleCheck('${taskId}')"></div>
          <div class="task-label">
            <div class="task-name">${t.name}</div>
            <div class="task-sub">${t.sub}</div>
          </div>
          <div class="task-expand" id="${taskId}-arrow">▾</div>
        </div>
        <div class="task-detail" id="${taskId}-detail">
          <div class="detail-section">
            <div class="detail-label">Difficulty &amp; files</div>
            <div>${diffTag(t.difficulty)}${langTags(t.tags)}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">What this does</div>
            <div class="detail-text">${t.what}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">How to build it</div>
            <div class="detail-text">${t.how}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Production code</div>
            <div class="code-block">${escHtml(t.code)}</div>
          </div>
        </div>
      </div>`;
    }).join('');

    div.innerHTML = `
      <div class="phase-title">${ph.label}</div>
      <div class="phase-desc">${ph.desc}</div>
      <div class="task-list">${taskHtml}</div>
    `;
    panels.appendChild(div);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleDetail(taskId) {
  const detail = document.getElementById(taskId + '-detail');
  const arrow = document.getElementById(taskId + '-arrow');
  const isOpen = detail.classList.contains('open');
  detail.classList.toggle('open', !isOpen);
  arrow.classList.toggle('open', !isOpen);
}

function toggleCheck(taskId) {
  const check = document.getElementById(taskId + '-check');
  if (completedTasks.has(taskId)) {
    completedTasks.delete(taskId);
    check.classList.remove('done');
  } else {
    completedTasks.add(taskId);
    check.classList.add('done');
  }
  updateProgress();
}

renderPhaseNav();
renderPhases();
updateProgress();
