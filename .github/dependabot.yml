version: 2
updates:
  # Main project - npm/pnpm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    groups:
      runtime-patches:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      tooling-patches:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Keep major upgrades as planned migration projects, not auto-merge noise.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
