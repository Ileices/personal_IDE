# ============================================
# CI/CD Pipeline — Personal IDE
# Runs on push/PR to main: type-check, build, test
# ============================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Job 1: TypeScript type-check + build
  # ─────────────────────────────────────────
  typecheck-and-build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check server
        run: pnpm --filter @personal-ide/server exec tsc --noEmit

      - name: Type-check web
        run: pnpm --filter @personal-ide/web exec tsc --noEmit

      - name: Build web (Vite)
        run: pnpm --filter @personal-ide/web build

  # ─────────────────────────────────────────
  # Job 2: Cross-platform subsystem contracts
  # ─────────────────────────────────────────
  tests:
    name: Subsystem Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: typecheck-and-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run portable subsystem contract suite
        run: pnpm run test:subsystems:e2e

  # ─────────────────────────────────────────
  # Job 3: Python NANO tests
  # ─────────────────────────────────────────
  nano-tests:
    name: NANO Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('NANO_train/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Python deps
        run: |
          cd NANO_train
          pip install -r requirements.txt

      - name: Run NANO integration tests
        run: python NANO_train/tests/test_integration.py

  # ─────────────────────────────────────────
  # Job 4: Lint / format checks (optional)
  # ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Basic: check that no import is broken
      - name: Check shared package
        run: pnpm --filter @personal-ide/shared exec tsc --noEmit

  # ─────────────────────────────────────────
  # Job 5: Security checks
  # ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high+)
        run: |
          set -euo pipefail
          for dir in . apps/server apps/web testing packages/shared; do
            if [ -f "$dir/package.json" ]; then
              echo "Auditing $dir"
              pnpm --dir "$dir" audit --audit-level high
            fi
          done

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit for NANO requirements
        run: pip-audit -r NANO_train/requirements.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --config .gitleaks.toml --redact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
